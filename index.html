<meta name="apple-mobile-web-app-capable" content="yes">
<style>html,body{margin:0}body{padding-top:env(safe-area-inset-top,0px)}</style>
<title>EDAHM Lokal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: one-column phone app. Hairline-separated rows (no card stacks), bottom tab bar, bottom-sheet forms. */
:root{
  --bg:#F2F6F1; --surface:#FFFFFF; --ink:#11261B; --muted:#58695E; --line:#D8E3DA;
  --accent:#0B6B47; --on-accent:#FFFFFF; --gold:#C79A2B;
  --danger:#C4163A; --warn:#9A5B00; --ok:#0B6B47;
  --font-display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --font-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1510; --surface:#12231A; --ink:#E5F0E8; --muted:#9BB0A2; --line:#223A2D;
    --accent:#4FCB91; --on-accent:#05140C; --gold:#E3B94F;
    --danger:#FF7D96; --warn:#F2B552; --ok:#4FCB91; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1510; --surface:#12231A; --ink:#E5F0E8; --muted:#9BB0A2; --line:#223A2D;
  --accent:#4FCB91; --on-accent:#05140C; --gold:#E3B94F;
  --danger:#FF7D96; --warn:#F2B552; --ok:#4FCB91; color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--font-body);padding-inline:16px;padding-block:0 150px}
.app{max-width:560px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding-block:22px 10px}
h1{font:700 27px/1.1 var(--font-display);letter-spacing:-.02em;margin:0;display:flex;align-items:center;gap:10px}
h1::before{content:'';width:10px;height:26px;border-radius:3px;background:linear-gradient(var(--accent) 0 60%,var(--gold) 60%)}
.today{color:var(--muted);font-size:13px;text-align:right}
.hr{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
select.lang{width:auto;font-size:13px;padding:5px 8px;border-radius:8px}
.banner{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:13px;margin-block:8px}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-block:10px 4px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}
.tile small{display:block;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.tile b{display:block;font:700 18px/1.25 var(--font-display);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tile b.zero{color:var(--muted);font-weight:600}
.grp{display:flex;align-items:baseline;justify-content:space-between;margin:22px 0 2px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.grp.late{color:var(--danger)}
.row{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 0}
.dt{text-align:center;line-height:1}
.dt b{display:block;font:700 22px/1 var(--font-display);font-variant-numeric:tabular-nums}
.dt span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:3px}
.rt{font-weight:600;overflow-wrap:anywhere}
.rm{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.rr{text-align:right;display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.amt{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.row.done .rt{text-decoration:line-through;color:var(--muted)}
.row.done{opacity:.6}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap;background:color-mix(in srgb,var(--muted) 16%,transparent);color:var(--muted)}
.pill.late{background:color-mix(in srgb,var(--danger) 15%,transparent);color:var(--danger)}
.pill.today,.pill.soon{background:color-mix(in srgb,var(--warn) 17%,transparent);color:var(--warn)}
.pill.done{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.tag{font-size:11px;border:1px solid var(--line);border-radius:6px;padding:0 5px;margin-left:6px;color:var(--muted);font-weight:500}
.empty{margin-block:36px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:14px;align-items:center}
.empty p{margin:0;max-width:34ch}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--danger)}
.btn.link{border:0;background:none;color:var(--muted);font-weight:500;text-decoration:underline;min-height:0;padding:6px}
.btn[disabled]{opacity:.55;cursor:default}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
.tabs div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:6px 0;border-radius:8px}
.tabs button[aria-current="true"]{color:var(--accent)}
.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.fabw{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom,0px));padding-inline:16px;pointer-events:none;z-index:4}
.fabw div{max-width:560px;margin:0 auto;display:flex;justify-content:flex-end}
.fab{pointer-events:auto;background:var(--accent);color:var(--on-accent);border:0;border-radius:999px;padding:13px 20px;font-weight:700;box-shadow:0 6px 18px rgba(5,30,18,.30);display:inline-flex;gap:8px;align-items:center}
.scrim{position:fixed;inset:0;background:rgba(4,16,10,.55);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{width:100%;max-width:560px;max-height:92%;overflow-y:auto;background:var(--surface);border-radius:20px 20px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.sh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sh h2{font:700 21px/1.2 var(--font-display);margin:0;overflow-wrap:anywhere}
.x{background:none;border:0;font-size:26px;line-height:1;color:var(--muted);padding:0 4px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
input,select,textarea{font:16px/1.3 var(--font-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;min-width:0}
textarea{min-height:70px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 110px;gap:10px}
.two.eq{grid-template-columns:1fr 1fr}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--bg);border-radius:12px;padding:4px}
.seg button{border:0;background:none;border-radius:9px;padding:8px 4px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(10,20,60,.18)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.err{color:var(--danger);font-size:13px;min-height:1em;margin:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;overflow-wrap:anywhere;font-weight:500}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts>*{flex:1 1 auto}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.ft{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--bg);padding:0;display:flex;align-items:center;justify-content:center;text-decoration:none;color:var(--ink);font-size:12px;font-weight:600;text-align:center}
.ft img{width:100%;height:100%;object-fit:cover;display:block}
.ft .nm{padding:6px;overflow-wrap:anywhere}
.cap{font-size:12px;color:var(--muted);margin-top:4px;overflow-wrap:anywhere}
.pend{display:flex;flex-wrap:wrap;gap:6px}
.pend span{font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:3px 8px;overflow-wrap:anywhere}
.big{width:100%;max-height:60vh;object-fit:contain;border-radius:12px;background:var(--bg)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(130px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:20;max-width:90%;text-align:center}
.foot{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:26px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.4}}}
</style>

</head>

  for(var i=2;i<arguments.length;i++){

function pad(n){return String(n).padStart(2,'0');}
function today(){var d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate());}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function pd(s){var a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2]);}
function addDays(s,n){var d=pd(s);d.setDate(d.getDate()+n);return iso(d);}
function addMonth(s){var d=pd(s),day=d.getDate();d.setMonth(d.getMonth()+1);if(d.getDate()!==day)d.setDate(0);return iso(d);}

function info(it){
  if(it.status==='done')return {k:'done',label:t('st_done')};
  if(!it.due)return {k:'nodate',label:t('st_nodate')};
  var d=daysUntil(it.due),win=Math.max.apply(null,[0].concat(it.remind||[]));
  if(d<0)return {k:'late',d:d,label:t('st_late',{d:ND(-d)})};

var URLS={};

function saveLocal(){
  try{localStorage.setItem('edahm-items',JSON.stringify(S.items));if(S.local){S.local=false;render();}}
  catch(e){if(!S.local){S.local=true;render();}}
}
function idbOpen(){return new Promise(function(res,rej){
  var r=indexedDB.open('edahm',1);
  r.onupgradeneeded=function(){r.result.createObjectStore('files');};
  r.onsuccess=function(){res(r.result);};r.onerror=function(){rej(r.error);};});}
function idbTx(db,mode,fn){return new Promise(function(res,rej){
  var tx=db.transaction('files',mode),out=fn(tx.objectStore('files'));
  tx.oncomplete=function(){res(out&&out.result);};tx.onerror=function(){rej(tx.error);};tx.onabort=function(){rej(tx.error);};});}
async function shrink(f){
  if(f.type.indexOf('image/')!==0||/gif|svg/.test(f.type))return f;
  try{
    var bmp=await createImageBitmap(f),k=Math.min(1,1600/Math.max(bmp.width,bmp.height));
    var c=document.createElement('canvas');c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
    c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    var b=await new Promise(function(r){c.toBlob(r,'image/jpeg',0.82);});
    return b&&b.size<f.size?b:f;
  }catch(e){return f;}
}
function makeAssets(db){return {
  upload:async function(f){
    var ok=f.type.indexOf('image/')===0||f.type==='application/pdf';
    if(!ok)throw {code:'unsupported_type'};
    if(f.size>25*1048576)throw {code:'too_large'};
    var b=await shrink(f),id='f'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
    await idbTx(db,'readwrite',function(st){return st.put(b,id);});
    URLS[id]=URL.createObjectURL(b);
    return {id:id,contentType:b.type||f.type};
  },
  delete:async function(id){
    await idbTx(db,'readwrite',function(st){return st.delete(id);});
    if(URLS[id]){URL.revokeObjectURL(URLS[id]);delete URLS[id];}
  }};}

/* ---------- storage ---------- */
function newId(){return S.col?S.col.doc().id:'l'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);}
function strip(it){var o={};Object.keys(it).forEach(function(k){if(k!=='id'&&it[k]!==undefined)o[k]=it[k];});return o;}
async function put(id,obj){
  try{
    if(S.col){await S.col.doc(id).set(obj);}
    else{
      var i=S.items.findIndex(function(x){return x.id===id;});
      var rec=Object.assign({id:id},obj);
      if(i>=0)S.items[i]=rec;else S.items.push(rec);
      saveLocal();render();
    }
    return true;
  }catch(e){toast(t('t_save_fail'));return false;}
}
async function del(it){
  try{
    if(S.col){await S.col.doc(it.id).delete();}
    else{S.items=S.items.filter(function(x){return x.id!==it.id;});saveLocal();render();}
    if(S.assets&&it.docs){for(var i=0;i<it.docs.length;i++){try{await S.assets.delete(it.docs[i].id);}catch(e){}}}
    return true;
  }catch(e){toast(t('t_del_fail'));return false;}
}
async function upload(files){
  var out=[];
  for(var i=0;i<files.length;i++){
    var f=files[i];
    try{
      var r=await S.assets.upload(f);
      out.push({id:r.id,name:f.name||'photo',type:r.contentType||f.type});
    }catch(e){
      toast(e&&e.code==='unsupported_type'?t('t_unsupported'):e&&e.code==='too_large'?t('t_too_large'):t('t_upload_fail'));

function sums(){

    var c=it.cur==='USD'?'USD':'HTG',r=it.type==='bill'?(Number(it.amount)||0):remaining(it);

    parent?el('div',{class:'cap',text:parent.title}):null);
  return el('div',null,
    el('a',{class:'ft',href:blobUrl(f.id),target:'_blank',rel:'noopener'},el('span',{class:'nm',text:'PDF · '+f.name})),
    parent?el('div',{class:'cap',text:parent.title}):null);
}
function viewDocs(box){
  if(!S.assets){
    box.append(el('div',{class:'banner',text:t('need_assets')}));
  }else{
    box.append(el('div',{class:'acts',style:'margin-block:10px'},
      el('button',{class:'btn primary',type:'button',onclick:function(){pick('cam',quickDoc);},text:t('take_photo')}),
      el('button',{class:'btn',type:'button',onclick:function(){pick('file',quickDoc);},text:t('add_file')})));
  }
  var items=S.items.filter(function(i){return i.docs&&i.docs.length;}).sort(function(a,b){return (b.createdAt||'')<(a.createdAt||'')?-1:1;});
  if(!items.length){box.append(emptyBox(t('empty_doc'),false));return;}
  var grid=el('div',{class:'files'});
  items.forEach(function(it){it.docs.forEach(function(f){grid.append(fileTile(f,it));});});
  box.append(grid);
}

/* ---------- main render ---------- */
function render(){
  var d=new Date();
  document.getElementById('today').textContent=LG().dhead(LG().dow[d.getDay()],d.getDate(),LG().mon[d.getMonth()]);
  document.documentElement.lang=S.lang;
  document.getElementById('nav').setAttribute('aria-label',t('nav'));
  var ls=document.getElementById('lang');ls.value=S.lang;ls.setAttribute('aria-label',t('lang'));
  var tabs=document.getElementById('tabs');tabs.textContent='';
  TABS.forEach(function(tb){
    tabs.append(el('button',{type:'button','aria-current':String(S.tab===tb.k),onclick:function(){S.tab=tb.k;render();window.scrollTo(0,0);}},icon(tb.p),t('tab_'+tb.k)));
  });
  document.getElementById('fabl').textContent=S.tab==='doc'?t('new_doc'):t('add');
  document.getElementById('banner').textContent='';
  if(S.local)document.getElementById('banner').append(el('div',{class:'banner',text:t('local_banner')}));
  var box=document.getElementById('view');box.textContent='';
  if(S.tab==='rapel')viewRapel(box);
  else if(S.tab==='doc')viewDocs(box);
  else viewType(box,S.tab);
  if(S.sheet&&S.sheet.mode==='detail')renderSheet();
}

/* ---------- sheets ---------- */
var scrim=document.getElementById('scrim');
function closeSheet(){S.sheet=null;scrim.hidden=true;scrim.textContent='';}
scrim.addEventListener('click',function(e){if(e.target===scrim)closeSheet();});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&S.sheet)closeSheet();});
function renderSheet(){
  scrim.textContent='';
  if(!S.sheet){scrim.hidden=true;return;}
  var m=S.sheet.mode,body;
  if(m==='form')body=formSheet();
  else if(m==='view')body=viewSheet();
  else if(m==='restore')body=restoreSheet();
  else body=detailSheet();
  if(!body){closeSheet();return;}
  scrim.append(body);scrim.hidden=false;
}
function head(title){
  return el('div',{class:'sh'},el('h2',{text:title}),el('button',{class:'x',type:'button','aria-label':t('close'),onclick:closeSheet,text:'×'}));
}
function openView(f,parent){S.sheet={mode:'view',f:f,parent:parent};renderSheet();}
function viewSheet(){
  var f=S.sheet.f,p=S.sheet.parent;
  return el('div',{class:'sheet',role:'dialog','aria-modal':'true'},head(f.name),
    el('img',{class:'big',src:blobUrl(f.id),alt:f.name}),
    p?el('button',{class:'btn',type:'button',onclick:function(){openDetail(p.id);},text:t('view_detail',{t:p.title})}):null);
}
function openDetail(id){S.sheet={mode:'detail',id:id,confirm:false};renderSheet();}
function gcal(it){
  var c=it.due.replace(/-/g,''),dates;
  if(it.time){
    var t=it.time.replace(':',''),e=pad(Math.min(23,Number(it.time.slice(0,2))+1))+it.time.slice(3,5);
    dates=c+'T'+t+'00/'+c+'T'+e+'00';
  }else dates=c+'/'+addDays(it.due,1).replace(/-/g,'');
  var det=typeName(it.type)+(it.amount?' · '+money(it.type==='debt'?remaining(it):it.amount,it.cur):'')+(it.note?'\n'+it.note:'');
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(it.title)+'&dates='+dates+'&details='+encodeURIComponent(det)+(it.place?'&location='+encodeURIComponent(it.place):'');
}
function detailSheet(){
  var it=S.items.find(function(x){return x.id===S.sheet.id;});
  if(!it)return null;
  var inf=info(it),kv=el('dl',{class:'kv'});
  function add(k,v){if(v!==''&&v!=null&&v!==false){kv.append(el('dt',{text:k}),el('dd',{text:v}));}}
  add(t('k_kind'),typeName(it.type)+(it.type==='debt'?' · '+(it.dir==='dwem'?t('dir_owed_s'):t('dir_owe_s')):''));
  if(it.amount)add(t('k_amount'),money(it.amount,it.cur));
  if(it.type==='debt'&&it.paid>0){add(t('k_paid'),money(it.paid,it.cur));add(t('k_rest'),money(remaining(it),it.cur));}
  if(it.due)add(t('k_date'),fmtDate(it.due)+(it.time?' '+t('at')+' '+it.time:''));
  add(t('k_place'),it.place);
  if(it.repeat==='mwa')add(t('k_repeat'),t('every_month_cap'));
  if(it.remind&&it.remind.length)add(t('k_remind'),it.remind.slice().sort(function(a,b){return b-a;}).map(function(n){return t('days_before',{d:ND(n)});}).join(', '));
  add(t('k_note'),it.note);
  if(it.lastPaid)add(t('k_lastpaid'),fmtDate(it.lastPaid));
  var nodes=[head(it.title)];
  if(it.type!=='doc')nodes.push(el('div',null,el('span',{class:'pill '+inf.k,text:inf.label})));
  nodes.push(kv);
  if(it.docs&&it.docs.length){var g=el('div',{class:'files'});it.docs.forEach(function(f){g.append(fileTile(f,null));});nodes.push(g);}
  var acts=el('div',{class:'acts'});
  if(it.type!=='doc'){
    if(it.status==='done')acts.append(el('button',{class:'btn',type:'button',onclick:function(){act(it,'reopen');},text:t('reopen')}));
    else acts.append(el('button',{class:'btn primary',type:'button',onclick:function(){act(it,'done');},text:{bill:t('mark_paid'),debt:it.dir==='dwem'?t('cleared_owed'):t('cleared_owe'),rdv:t('mark_done')}[it.type]}));
  }
  nodes.push(acts);
  if(it.type==='debt'&&it.status!=='done'){
    var pi=el('input',{id:'pay',type:'text',inputmode:'decimal',placeholder:t('pay_ph'),style:'flex:1 1 100%'});
    nodes.push(el('div',{class:'acts'},pi,el('button',{class:'btn',type:'button',onclick:function(){
      var v=num(pi.value);if(!(v>0)){toast(t('enter_amount'));return;}act(it,'pay',v);},text:t('pay_btn')})));
  }
  var more=el('div',{class:'acts'});
  if(S.assets){
    more.append(el('button',{class:'btn',type:'button',onclick:function(){pick('cam',function(fs){attach(it,fs);});},text:t('take_photo')}),
      el('button',{class:'btn',type:'button',onclick:function(){pick('file',function(fs){attach(it,fs);});},text:t('add_file')}));
  }
  if(it.due&&it.type!=='doc')more.append(el('a',{class:'btn',href:gcal(it),target:'_blank',rel:'noopener',text:t('gcal_btn')}));
  nodes.push(more);
  nodes.push(el('div',{class:'acts'},
    el('button',{class:'btn',type:'button',onclick:function(){openForm(it.id);},text:t('edit')}),
    S.sheet.confirm?el('button',{class:'btn danger',type:'button',onclick:async function(){if(await del(it))closeSheet();},text:t('del_yes')}):
      el('button',{class:'btn danger',type:'button',onclick:function(){S.sheet.confirm=true;renderSheet();},text:t('del')})));
  return el('div',{class:'sheet',role:'dialog','aria-modal':'true'},nodes);
}
async function act(it,what,v){
  var o=strip(it),msg='';
  if(what==='done'){
    if(it.type==='bill'&&it.repeat==='mwa'&&it.due){o.due=addMonth(it.due);o.lastPaid=iso(today());msg=t('t_paid_next',{d:fmtDate(o.due)});}
    else{o.status='done';o.doneAt=iso(today());if(it.type==='debt')o.paid=Number(it.amount)||0;msg=t('t_done');}
  }else if(what==='reopen'){o.status='open';delete o.doneAt;msg=t('t_reopened');}
  else if(what==='pay'){
    o.paid=(Number(it.paid)||0)+v;
    if(o.paid>=(Number(it.amount)||0)){o.status='done';o.doneAt=iso(today());msg=t('t_debt_cleared');}else msg=t('t_pay_saved');
  }
  if(await put(it.id,o))toast(msg);
}
async function attach(it,files){
  if(!files.length)return;
  toast(t('t_uploading'));
  var up=await upload(files);if(!up.length)return;
  var o=strip(it);o.docs=(it.docs||[]).concat(up);
  if(await put(it.id,o))toast(t('t_file_added'));
}

/* ---------- form ---------- */
function num(s){var n=Number(String(s||'').replace(/\s/g,'').replace(',','.'));return isFinite(n)?n:NaN;}
function openForm(id,type){
  var ex=id?S.items.find(function(i){return i.id===id;}):null,ty=type||'bill';
  var d=ex?Object.assign({},ex,{remind:(ex.remind||[]).slice(),docs:(ex.docs||[]).slice()}):
    {type:ty,title:'',amount:'',cur:'HTG',dir:'dwe',due:'',time:'',place:'',repeat:'',remind:DEFREM[ty].slice(),note:'',docs:[],status:'open',paid:0};
  if(!ex&&(ty==='rdv'||ty==='bill'))d.due=iso(today());
  S.sheet={mode:'form',id:id||null,d:d,files:[],err:''};
  renderSheet();
}
function val(id){var n=document.getElementById(id);return n?n.value:null;}
function sync(){
  var d=S.sheet.d,v;
  if((v=val('f-title'))!==null)d.title=v;
  if((v=val('f-amount'))!==null)d.amount=v;
  if((v=val('f-cur'))!==null)d.cur=v;
  if((v=val('f-due'))!==null)d.due=v;
  if((v=val('f-time'))!==null)d.time=v;
  if((v=val('f-place'))!==null)d.place=v;
  if((v=val('f-repeat'))!==null)d.repeat=v;
  if((v=val('f-note'))!==null)d.note=v;
}
function field(label,input){return el('label',{class:'f'},label,input);}
function formSheet(){
  var S0=S.sheet,d=S0.d,ty=d.type,editing=!!S0.id,nodes=[];
  nodes.push(head(editing?t('f_edit'):t('f_new',{x:typeName(ty).toLowerCase()})));
  if(!editing){
    var seg=el('div',{class:'seg',role:'group','aria-label':t('k_kind')});
    ['bill','debt','rdv','doc'].forEach(function(k){
      seg.append(el('button',{type:'button','aria-pressed':String(k===ty),onclick:function(){sync();d.type=k;d.remind=DEFREM[k].slice();
        if((k==='bill'||k==='rdv')&&!d.due)d.due=iso(today());renderSheet();},text:typeName(k)}));
    });
    nodes.push(seg);
  }
  if(ty==='debt'){
    var sg=el('div',{class:'seg',role:'group'});
    [['dwe',t('owe')],['dwem',t('owed')]].forEach(function(o){
      sg.append(el('button',{type:'button','aria-pressed':String(d.dir===o[0]),onclick:function(){sync();d.dir=o[0];renderSheet();},text:o[1]}));
    });
    nodes.push(sg);
  }
  nodes.push(field(ty==='debt'?t('f_person'):t('f_name'),el('input',{id:'f-title',type:'text',value:d.title,placeholder:t('ph_'+ty),autocomplete:'off'})));
  if(ty==='bill'||ty==='debt'){
    nodes.push(el('div',{class:'two'},
      field(t('k_amount'),el('input',{id:'f-amount',type:'text',inputmode:'decimal',value:d.amount,placeholder:'0'})),
      field(t('f_currency'),(function(){var sl=el('select',{id:'f-cur'},el('option',{value:'HTG',text:t('cur_htg')}),el('option',{value:'USD',text:t('cur_usd')}));sl.value=d.cur||'HTG';return sl;})())));
  }
  if(ty!=='doc'){
    nodes.push(el('div',{class:ty==='rdv'?'two eq':''},
      field(ty==='debt'?t('f_due_opt'):t('k_date'),el('input',{id:'f-due',type:'date',value:d.due})),
      ty==='rdv'?field(t('f_time'),el('input',{id:'f-time',type:'time',value:d.time})):null));
  }
  if(ty==='rdv')nodes.push(field(t('k_place'),el('input',{id:'f-place',type:'text',value:d.place,placeholder:t('place_ph')})));
  if(ty==='bill'){
    nodes.push(field(t('f_repeat'),(function(){var sl=el('select',{id:'f-repeat'},el('option',{value:'',text:t('rep_once')}),el('option',{value:'mwa',text:t('rep_month')}));sl.value=d.repeat||'';return sl;})()));
  }
  if(ty!=='doc'){
    var chips=el('div',{class:'chips'});
    [1,3,7,14].forEach(function(n){
      chips.append(el('button',{class:'chip',type:'button','aria-pressed':String(d.remind.indexOf(n)>=0),onclick:function(e){
        var i=d.remind.indexOf(n);if(i>=0)d.remind.splice(i,1);else d.remind.push(n);
        e.currentTarget.setAttribute('aria-pressed',String(i<0));},text:ND(n)}));
    });
    nodes.push(el('div',{class:'f',style:'display:flex;flex-direction:column;gap:6px'},el('span',{style:'font-size:13px;font-weight:600;color:var(--muted)',text:t('f_remind')}),chips));
  }
  nodes.push(field(t('k_note'),el('textarea',{id:'f-note',text:d.note||''})));
  if(S.assets){
    var pend=el('div',{class:'pend'});
    S0.files.forEach(function(f){pend.append(el('span',{text:f.name||'photo'}));});
    (d.docs||[]).forEach(function(f){pend.append(el('span',{text:'✓ '+f.name}));});
    nodes.push(el('div',{style:'display:flex;flex-direction:column;gap:8px'},
      el('div',{class:'acts'},
        el('button',{class:'btn',type:'button',onclick:function(){sync();pick('cam',function(fs){S0.files=S0.files.concat(fs);renderSheet();});},text:t('take_photo')}),
        el('button',{class:'btn',type:'button',onclick:function(){sync();pick('file',function(fs){S0.files=S0.files.concat(fs);renderSheet();});},text:t('add_file')})),
      pend.children.length?pend:null));
  }
  nodes.push(el('p',{class:'err',id:'err',role:'alert',text:S0.err||''}));
  nodes.push(el('button',{class:'btn primary',id:'save',type:'button',onclick:saveForm,text:t('save')}));
  return el('div',{class:'sheet',role:'dialog','aria-modal':'true'},nodes);
}
function fail(m){var e=document.getElementById('err');if(e)e.textContent=m;S.sheet.err=m;}
async function saveForm(){
  if(S.busy)return;
  sync();
  var s=S.sheet,d=s.d,ty=d.type,amt=num(d.amount);
  if(!String(d.title).trim())return fail(t('err_title'));
  if((ty==='bill'||ty==='debt')&&!(amt>0))return fail(t('err_amount'));
  if((ty==='bill'||ty==='rdv')&&!d.due)return fail(t('err_date'));
  if(ty==='doc'&&!(d.docs.length||s.files.length))return fail(t('err_files'));
  S.busy=true;var btn=document.getElementById('save');if(btn){btn.disabled=true;btn.textContent=t('saving');}
  var docs=d.docs.slice();
  if(s.files.length&&S.assets){docs=docs.concat(await upload(s.files));}
  var o={type:ty,title:String(d.title).trim(),status:d.status||'open',docs:docs,createdAt:d.createdAt||new Date().toISOString(),note:String(d.note||'').trim()};
  if(ty==='bill'||ty==='debt'){o.amount=amt;o.cur=d.cur||'HTG';o.paid=Number(d.paid)||0;}
  if(ty==='debt')o.dir=d.dir||'dwe';
  if(ty!=='doc'){o.due=d.due||'';o.remind=d.remind.slice();}
  if(ty==='rdv'){o.time=d.time||'';o.place=String(d.place||'').trim();}
  if(ty==='bill')o.repeat=d.repeat||'';
  if(d.example)o.example=true;
  if(d.lastPaid)o.lastPaid=d.lastPaid;
  if(d.doneAt)o.doneAt=d.doneAt;
  var id=s.id||newId();
  var ok=await put(id,o);
  S.busy=false;
  if(ok){closeSheet();toast(t('t_saved'));if(!s.id)S.tab=ty==='doc'?'doc':'rapel';render();}
  else if(btn){btn.disabled=false;btn.textContent=t('save');}
}

/* ---------- pickers, examples, backup ---------- */
function pick(kind,cb){
  var inp=document.getElementById(kind==='cam'?'in-cam':'in-file');
  inp.value='';
  inp.onchange=function(){var fs=[].slice.call(inp.files||[]);inp.value='';if(fs.length)cb(fs);};
  inp.click();
}
async function quickDoc(files){
  toast(t('t_uploading'));
  var up=await upload(files);if(!up.length)return;
  var n=today();
  var ok=await put(newId(),{type:'doc',title:t('doc_default',{d:n.getDate()+' '+LG().mon3[n.getMonth()]}),status:'open',docs:up,createdAt:new Date().toISOString(),note:''});
  if(ok)toast(t('t_doc_saved'));
}
async function loadExamples(){
  var td=iso(today());
  var ex=[
    {type:'bill',title:t('ex_edh'),amount:2400,cur:'HTG',due:addDays(td,2),remind:[3,1],repeat:'mwa'},
    {type:'bill',title:t('ex_net'),amount:25,cur:'USD',due:addDays(td,9),remind:[7,1],repeat:'mwa'},
    {type:'debt',title:t('ex_loan'),dir:'dwe',amount:5000,cur:'HTG',paid:1500,due:addDays(td,20),remind:[3]},
    {type:'debt',title:t('ex_jak'),dir:'dwem',amount:3000,cur:'HTG',paid:0,due:addDays(td,-4),remind:[3]},
    {type:'rdv',title:t('ex_dr'),due:addDays(td,3),time:'09:30',place:t('ex_place'),remind:[1]}
  ];
  for(var i=0;i<ex.length;i++){await put(newId(),Object.assign({status:'open',docs:[],note:'',example:true,createdAt:new Date().toISOString()},ex[i]));}
}
async function clearExamples(){
  var xs=S.items.filter(function(i){return i.example;});
  for(var i=0;i<xs.length;i++){await del(xs[i]);}
  toast(t('t_ex_cleared'));
}
async function backup(){
  var txt=JSON.stringify(S.items.map(function(i){var o=strip(i);o.docs=[];return o;}),null,1);
  try{await navigator.clipboard.writeText(txt);toast(t('t_backup_copied'));}
  catch(e){S.sheet={mode:'restore',text:txt};renderSheet();}
}
function restoreSheet(){
  var ta=el('textarea',{id:'rs-text',style:'min-height:150px;font-size:13px',placeholder:t('restore_ph')});
  ta.value=S.sheet.text||'';
  var err=el('p',{class:'err',role:'alert'});
  return el('div',{class:'sheet',role:'dialog','aria-modal':'true'},head(t('restore')),ta,err,
    el('button',{class:'btn primary',type:'button',onclick:async function(){
      var arr;
      try{arr=JSON.parse(ta.value);if(!Array.isArray(arr))throw 0;}catch(e){err.textContent=t('restore_bad');return;}
      var n=0;
      for(var i=0;i<arr.length;i++){
        var o=arr[i];
        if(!o||typeof o!=='object'||!DEFREM[o.type]||!String(o.title||'').trim())continue;
        delete o.id;o.docs=[];
        if(await put(newId(),o))n++;
      }
      if(!n){err.textContent=t('restore_bad');return;}
      closeSheet();toast(t('restored_n',{n:n}));
    },text:t('restore_btn')}));
}

/* ---------- boot ---------- */
try{var sl=localStorage.getItem('memo-lang');if(sl&&L[sl])S.lang=sl;}catch(e){}
document.getElementById('lang').addEventListener('change',function(e){
  if(S.sheet&&S.sheet.mode==='form')sync();
  S.lang=e.target.value;
  try{localStorage.setItem('memo-lang',S.lang);}catch(err){}
  render();
  if(S.sheet)renderSheet();
});
document.getElementById('fab').addEventListener('click',function(){openForm(null,S.tab==='rapel'?'bill':S.tab);});
render();
(async function(){
  try{var raw=localStorage.getItem('edahm-items');if(raw){var a=JSON.parse(raw);if(Array.isArray(a))S.items=a;}}catch(e){}
  try{
    var db=await idbOpen();
    await new Promise(function(res){
      var rq=db.transaction('files','readonly').objectStore('files').openCursor();
      rq.onsuccess=function(){var c=rq.result;if(c){URLS[c.key]=URL.createObjectURL(c.value);c.continue();}else res();};
      rq.onerror=function(){res();};
    });
    S.assets=makeAssets(db);
  }catch(e){S.assets=null;}
  render();
})();
setInterval(function(){if(document.visibilityState==='visible'&&!S.sheet)render();},60000);
})();
</script>
